name: False positive
description: Report a harmless change that DeltaTeX marked as risky.
title: "[False positive] "
labels: ["false-positive"]
body:
  - type: textarea
    attributes:
      label: Before formula
      render: latex
    validations:
      required: true
  - type: textarea
    attributes:
      label: After formula
      render: latex
    validations:
      required: true
  - type: textarea
    attributes:
      label: DeltaTeX finding
    validations:
      required: true
  - type: input
    attributes:
      label: DeltaTeX version
    validations:
      required: true

